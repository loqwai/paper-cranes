<!doctype html>
<html lang="en">

<head>
  <title>Paper Cranes - Secret List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <style>
    /* ------------------------------------------------------------------
       Sizing is tuned for a dark, loud room and one thumb:
       nothing tappable is under 48px, nothing readable is under 17px.
       ------------------------------------------------------------------ */
    :root {
      --title-size: clamp(19px, 4.6vw, 30px);
      --text-size: clamp(15px, 3.6vw, 22px);
      --small-size: clamp(12px, 2.9vw, 15px);
      --padding: clamp(4px, 1vw, 8px);
      --tap: 52px;
      --bar-height: 66px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --accent: #4ade80;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: rgba(255, 255, 255, 0.15);
    }

    body,
    input,
    button,
    a {
      font-family: system-ui, sans-serif;
      color: #fff;
      text-decoration: none;
      min-width: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: #000;
      line-height: 1.5;
      /* Leave room for the fixed bottom bar so the last row is always reachable */
      padding-bottom: calc(var(--bar-height) + var(--safe-bottom) + 12px);
    }

    button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: inherit;
    }

    main {
      display: flex;
      flex-direction: column;
      padding: var(--padding);
    }

    ul {
      list-style: none;
    }

    /* ----------------------------------------------------------------------
       Top dock: the search box lives HERE, in the page, permanently visible —
       not inside a sheet. A sheet plus the phone keyboard covered the results,
       so he was typing blind and could not watch the list narrow. Sticky (not
       fixed) so it takes real flow space and never overlaps the first row.
       ---------------------------------------------------------------------- */
    .top-dock {
      position: sticky;
      top: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(8px);
    }

    .find-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .find-glyph {
      flex-shrink: 0;
      font-size: var(--text-size);
      opacity: 0.75;
    }

    .find-input {
      flex: 1;
      min-width: 0;
      min-height: var(--tap);
      font-size: calc(var(--text-size) * 1.1);
      font-weight: 600;
      padding: 8px 12px;
      background: #16161c;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      color: #fff;
    }

    .find-input::placeholder {
      color: rgba(255, 255, 255, 0.45);
      font-weight: 400;
    }

    .find-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .find-bar.searching .find-input {
      border-color: var(--accent);
      background: #10201a;
    }

    /* Native clear "x" is a ~10px target in the dark — use our own 52px one. */
    .find-input::-webkit-search-cancel-button {
      display: none;
    }

    .find-clear {
      flex-shrink: 0;
      width: var(--tap);
      height: var(--tap);
      font-size: 22px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.14);
    }

    /* ---------------- Status strip: why is my list short? ---------------- */
    .status-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      font-size: var(--small-size);
    }

    .status-text .paused {
      color: #fbbf24;
      font-weight: 700;
    }

    .status-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #cbd5e1;
    }

    .status-text b {
      color: #fff;
    }

    .clear-all {
      flex-shrink: 0;
      padding: 8px 14px;
      min-height: 40px;
      border-radius: 999px;
      background: var(--danger);
      color: #000;
      font-weight: 800;
      font-size: var(--small-size);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ---------------- Shader rows ---------------- */
    .shader-list>li {
      display: flex;
      flex-direction: column;
      margin-bottom: 3px;
      border-radius: 10px;
      overflow: hidden;
    }

    .main-link {
      display: flex;
      align-items: stretch;
      min-height: var(--tap);
    }

    .row-star {
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--tap);
      flex-shrink: 0;
      font-size: calc(var(--title-size) * 0.9);
      line-height: 1;
      color: rgba(255, 255, 255, 0.35);
      text-shadow: 0 1px 3px #000;
    }

    .row-star.on {
      color: #fde047;
      text-shadow: 0 0 10px rgba(253, 224, 71, 0.8);
    }

    .row-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8px 4px;
      min-width: 0;
      cursor: pointer;
      text-align: left;
    }

    /* Wrap to two lines rather than truncating: six rows all reading
       "chromadepth lat…" is unusable, and the disambiguating part of these
       names (the iteration number) lives at the end. */
    .row-name {
      font-size: var(--title-size);
      font-weight: 650;
      line-height: 1.15;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    .row-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: var(--small-size);
      color: rgba(255, 255, 255, 0.82);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    .row-meta .dot {
      opacity: 0.5;
    }

    /* Which "iris 1" is this one? */
    .row-meta .path {
      opacity: 0.62;
      font-family: ui-monospace, monospace;
    }

    .row-meta .tag {
      opacity: 0.95;
    }

    .row-meta .badge-saved {
      color: #7dd3fc;
      font-weight: 700;
    }

    .row-actions {
      display: flex;
      align-items: stretch;
      flex-shrink: 0;
    }

    .row-btn {
      width: var(--tap);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--text-size) * 1.1);
      color: #fff;
      text-shadow: 0 1px 4px #000;
      background: rgba(0, 0, 0, 0.25);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
    }

    .row-btn.in-set {
      background: rgba(74, 222, 128, 0.45);
      font-weight: 800;
    }

    /* Presets are secondary — narrow, but always present so the primary
       buttons line up in the same column down the whole list. */
    .row-btn.presets {
      width: 34px;
      font-size: var(--small-size);
      font-weight: 700;
    }

    .row-btn.presets.none {
      opacity: 0;
      pointer-events: none;
    }

    /* Presets nested under a shader */
    .preset-list {
      background: rgba(0, 0, 0, 0.55);
    }

    .preset-link {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 46px;
      padding: 6px 10px 6px 18px;
      font-size: var(--text-size);
      border-top: 1px solid rgba(255, 255, 255, 0.09);
      width: 100%;
      text-align: left;
    }

    .preset-link span {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      padding: 40px 16px;
      text-align: center;
      color: #94a3b8;
      font-size: var(--text-size);
    }

    /* ---------------- Bottom command bar (thumb zone) ---------------- */
    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 80;
      display: flex;
      height: calc(var(--bar-height) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: rgba(8, 8, 10, 0.97);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.22);
    }

    .bar-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      position: relative;
      color: #e2e8f0;
      min-width: 0;
    }

    .bar-btn .glyph {
      font-size: 20px;
      line-height: 1;
    }

    .bar-btn .label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 2px;
    }

    .bar-btn.active {
      color: #000;
      background: var(--accent);
    }

    .bar-btn .count {
      position: absolute;
      top: 6px;
      right: 50%;
      transform: translateX(22px);
      background: var(--danger);
      color: #000;
      font-size: 11px;
      font-weight: 800;
      border-radius: 999px;
      min-width: 18px;
      height: 18px;
      line-height: 18px;
      text-align: center;
      padding: 0 4px;
    }

    /* ---------------- Sheets (slide up from the bar) ---------------- */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(0, 0, 0, 0.72);
    }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(var(--bar-height) + var(--safe-bottom));
      z-index: 95;
      max-height: 68vh;
      display: flex;
      flex-direction: column;
      background: #0d0d12;
      border-top: 2px solid rgba(255, 255, 255, 0.28);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.8);
    }

    .sheet-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }

    .sheet-title {
      flex: 1;
      font-size: var(--text-size);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .sheet-close {
      width: 44px;
      height: 44px;
      font-size: 24px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
    }

    .sheet-body {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px;
    }

    .search-input {
      width: 100%;
      font-size: calc(var(--text-size) * 1.15);
      padding: 14px;
      background: #1b1b22;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 12px;
      color: #fff;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Big stacked option buttons — sort modes, toggles */
    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: var(--tap);
      padding: 12px 14px;
      margin-bottom: 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.09);
      font-size: var(--text-size);
      font-weight: 600;
      text-align: left;
    }

    .option .glyph {
      font-size: 22px;
      width: 28px;
      text-align: center;
      flex-shrink: 0;
    }

    .option .sub {
      display: block;
      font-size: var(--small-size);
      font-weight: 400;
      color: #94a3b8;
    }

    .option.on {
      background: rgba(74, 222, 128, 0.28);
      box-shadow: inset 0 0 0 2px var(--accent);
    }

    /* Tag chips: tri-state include / exclude */
    .tag-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 46px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.11);
      border: 2px solid transparent;
      font-size: var(--text-size);
      font-weight: 600;
    }

    .tag-chip .n {
      font-size: var(--small-size);
      opacity: 0.65;
    }

    .tag-chip.include {
      background: rgba(74, 222, 128, 0.32);
      border-color: var(--accent);
    }

    .tag-chip.exclude {
      background: rgba(248, 113, 113, 0.28);
      border-color: var(--danger);
      text-decoration: line-through;
      opacity: 0.85;
    }

    .tag-chip.mine {
      box-shadow: inset 0 0 0 1px #7dd3fc;
    }

    .hint {
      color: #94a3b8;
      font-size: var(--small-size);
      padding: 4px 4px 10px;
    }

    /* Setlist rows */
    .set-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: var(--tap);
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      margin-bottom: 6px;
      font-size: var(--text-size);
    }

    .set-row .pos {
      width: 26px;
      font-weight: 800;
      color: var(--accent);
      flex-shrink: 0;
    }

    .set-row .nm {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .set-row .rm {
      width: 44px;
      height: 44px;
      font-size: 20px;
      border-radius: 8px;
      background: rgba(248, 113, 113, 0.25);
      flex-shrink: 0;
    }

    .big-action {
      display: block;
      width: 100%;
      min-height: 60px;
      margin-top: 6px;
      border-radius: 14px;
      background: var(--accent);
      color: #000;
      font-size: calc(var(--text-size) * 1.15);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .ghost-action {
      display: block;
      width: 100%;
      min-height: 48px;
      margin-top: 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      font-size: var(--text-size);
      font-weight: 600;
    }

    /* ---------------- Perform overlay: live preview + one-tap next -------- */
    .perform {
      position: fixed;
      inset: 0;
      z-index: 120;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    .perform iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #000;
      display: block;
    }

    .perform-title {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 10px 14px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.85), transparent);
      font-size: var(--text-size);
      font-weight: 700;
      pointer-events: none;
      text-shadow: 0 2px 6px #000;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .perform-title .pos {
      color: var(--accent);
      font-weight: 900;
    }

    .perform-bar {
      display: flex;
      align-items: stretch;
      height: calc(74px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: rgba(8, 8, 10, 0.97);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
    }

    .perform-bar button {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: #e2e8f0;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .perform-bar button:last-child {
      border-right: none;
    }

    .perform-bar .glyph {
      font-size: 24px;
      line-height: 1;
    }

    .perform-bar .label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .perform-bar .wide {
      flex: 1.5;
      background: rgba(74, 222, 128, 0.18);
    }

    .perform-bar .on {
      color: #fde047;
    }

    .perform-drawer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(74px + var(--safe-bottom));
      max-height: 55vh;
      overflow-y: auto;
      padding: 12px;
      background: rgba(10, 10, 14, 0.97);
      border-top: 2px solid rgba(255, 255, 255, 0.25);
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 8px;
    }

    .image-grid button {
      position: relative;
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      background: #1b1b22;
      border: 2px solid transparent;
    }

    .image-grid button.on {
      border-color: var(--accent);
    }

    .image-grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .image-grid .cap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 2px 4px;
      font-size: 10px;
      background: rgba(0, 0, 0, 0.7);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tag-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tag-input-row input {
      flex: 1;
      font-size: var(--text-size);
      padding: 12px;
      background: #1b1b22;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      color: #fff;
    }

    .tag-input-row button {
      padding: 0 18px;
      border-radius: 10px;
      background: var(--accent);
      color: #000;
      font-weight: 800;
    }

    .toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(var(--bar-height) + var(--safe-bottom) + 16px);
      z-index: 200;
      padding: 12px 22px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.95);
      color: #000;
      font-weight: 800;
      font-size: var(--text-size);
      pointer-events: none;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
    }

    .edit-link {
      display: none;
    }

    /* ---------------- Desktop ---------------- */
    @media (min-width: 1200px) {
      :root {
        --title-size: 17px;
        --text-size: 15px;
        --small-size: 12px;
        --tap: 40px;
        --bar-height: 58px;
      }

      body {
        line-height: 1.35;
      }

      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 8px 16px;
      }

      .shader-list>li {
        margin-bottom: 2px;
      }

      .edit-link {
        display: flex;
        align-items: center;
        padding: 0 14px;
        font-size: var(--small-size);
        font-weight: 700;
        text-transform: uppercase;
        border-left: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.25);
      }

      /* left:50% + right:0 would only span half the viewport — pin width instead */
      .bottom-bar,
      .sheet {
        left: 50%;
        right: auto;
        width: 100%;
        max-width: 1200px;
        transform: translateX(-50%);
      }

      .bottom-bar {
        border-radius: 12px 12px 0 0;
      }
    }

    /* ---------------- Colour: the rainbow, kept but legible ------------- */
    :root {
      --darkness: 0.34;
      --rainbow-start: 270;
      --rainbow-step: 90;
    }

    .shader-list>li:nth-child(4n+1) {
      --i: 0;
    }

    .shader-list>li:nth-child(4n+2) {
      --i: 1;
    }

    .shader-list>li:nth-child(4n+3) {
      --i: 2;
    }

    .shader-list>li:nth-child(4n+4) {
      --i: 3;
    }

    .shader-list>li {
      --h: calc(var(--rainbow-start) + (var(--i) * var(--rainbow-step)));
      background: linear-gradient(105deg,
          hsla(var(--h), 100%, 50%, var(--darkness)) 0%,
          hsla(calc(var(--h) + 40), 100%, 40%, calc(var(--darkness) * 0.55)) 60%,
          rgba(0, 0, 0, 0.92) 100%);
    }
  </style>
  <script type="module" src="./src/worker-communication.js"></script>
</head>

<body>
  <main></main>
  <script type="module" src="./list.js">
  </script>
</body>

</html>
