<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Paper Cranes — VJ Pad</title>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="stylesheet" href="vjpad.css" />
</head>

<body>
    <header id="bar">
        <div id="dot" class="dot"></div>
        <div id="status">connecting…</div>
        <div id="fingers" class="fingers">0</div>
        <button id="wake" class="chip" type="button">AWAKE</button>
        <a class="chip" href="./vj.html">DIALS</a>
    </header>

    <nav id="banks" class="banks"></nav>
    <nav id="shaders" class="shaders"></nav>
    <div id="note" class="note"></div>

    <main id="pads"></main>

    <!-- SETUP screen: replaces the pad grid, reached only by a long-press on the
         status line. Never on screen during a show unless you put it there. -->
    <section id="editor" class="editor" hidden></section>
    <div id="sheet" class="sheet" hidden></div>

    <div id="learnfeed" class="note" hidden></div>
    <div id="loopdrawer" class="note" hidden style="max-height:40vh;overflow-y:auto"></div>

    <footer id="foot">
        <button id="release" class="bigbtn" type="button">RELEASE<small>back to music</small></button>
        <button id="reset" class="bigbtn" type="button">RESET<small>neutral look</small></button>
        <button id="learn" class="bigbtn" type="button">LEARN<small>confirm gesture</small></button>
    </footer>

    <script type="module" src="./vjpad.js"></script>
</body>

</html>
